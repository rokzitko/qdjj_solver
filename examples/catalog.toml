# Tutorials, one entry per examples/NN_topic directory, in reading order.
#
# Read by tools/gen_docs.py (the index in examples/README.md, the generated regions of each
# tutorial README and the physics manual's \tutorial pointers), tools/check_tutorials.py
# (runs the profiles and compares results.json with reference/<profile>.json) and
# tools/check_docs.py (structure, labels, pointers and shared quantities).
#
# physics:  physics-manual labels; the first one is the chapter that points to the tutorial.
# user:     user-manual pages used by the tutorial.
# extras:   optional dependencies of the full profile.
# shared:   numbers that the tutorial and the physics manual compute independently;
#           reference = key in reference/full.json, manual = \q key in docs/manual/generated/quoted.json.

[[tutorial]]
dir = "00_first_calculation"
title = "A first calculation"
summary = "Lowest odd-parity state of a small junction with the QP expansion, DMRG and exact diagonalization."
physics = ["sec:first-calculation", "sec:qp"]
user = ["README.md", "docs/interfaces.md"]
quick_seconds = 1
extras = ["dmrg"]

[[tutorial]]
dir = "01_subgap_states"
title = "Subgap states, singlet and doublet"
summary = "Singlet, excited singlet and doublet of the reference junction versus phase and detuning, the singlet–doublet transition and the supercurrents."
physics = ["sec:subgap", "ch:model", "ch:static"]
user = ["docs/models.md", "docs/interfaces.md", "docs/numerics.md"]
quick_seconds = 4
extras = ["plots"]

[[tutorial.shared]]
reference = "doublet_energy"
manual = "static.doublet_energy"
rtol = 1e-8

[[tutorial.shared]]
reference = "excited_energy"
manual = "static.excited_energy"
rtol = 1e-8

[[tutorial]]
dir = "02_driven_dot"
title = "The gate-driven isolated dot"
summary = "Quasienergies, Bessel-function harmonic weights in two gauges, replicas and Floquet zones, and Tien–Gordon sidebands of a gate-driven dot, checked against the exact solution."
physics = ["ch:ex-dot", "sec:gauge", "ch:probes"]
user = ["docs/floquet.md"]
quick_seconds = 2
extras = ["plots"]

[[tutorial]]
dir = "03_two_level_system"
title = "The proximitized dot as a driven two-level system"
