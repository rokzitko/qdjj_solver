# Physical and numerical conventions shared by the code and all documentation.
# tools/gen_docs.py renders them as docs/reference/conventions.md and as the physics manual's
# table tab:conventions (docs/manual/generated/conventions.tex). Mathematics is LaTeX between
# $...$ without manual-only macros, so that it renders in the PDF, on GitHub and on the site.

[[convention]]
quantity = "Units"
text = 'Energies use the units of the Hamiltonian parameters, usually with $\Delta=1$; $\hbar=1$, so $\Omega$ and $1/t$ have energy units'

[[convention]]
quantity = "Impurity"
text = '$H_d=\tfrac U2(n_d-1)^2+\epsilon(n_d-1)+B\,S^z_d$; the detuning $\epsilon=\epsilon_d+U/2$ vanishes at half filling; $B>0$ raises the spin-up level'

[[convention]]
quantity = "Reservoirs"
text = 'BCS leads with the real pairing term $-\Delta_l\sum_i(c^\dagger_{li\uparrow}c^\dagger_{li\downarrow}+\mathrm{h.c.})$, $\Delta_l>0$, and normal-state half-bandwidth $D$; normal-state density of states per spin $\rho=1/(2D)$'

[[convention]]
quantity = "Hybridization"
text = '$\Gamma=\sum_l\Gamma_l$ is the total hybridization, $\Gamma_l=\pi\rho\lvert t_l\rvert^2$ with $t_l$ the hopping between the dot and the contact orbital of lead $l$'

[[convention]]
quantity = "Phases"
text = 'Factors $\mathrm{e}^{\mathrm{i}\phi_l/2}$ on the tunnelling terms $C^\dagger_{l\sigma}d_\sigma$, i.e. the physical pair potential $\Delta_l\mathrm{e}^{-\mathrm{i}\phi_l}$ and the pair amplitude $\langle c^\dagger_{li\uparrow}c^\dagger_{li\downarrow}\rangle\propto\mathrm{e}^{\mathrm{i}\phi_l}$; the reference junction uses $\phi_{L,R}=\mp\phi/2$, $\phi=\phi_R-\phi_L$'

[[convention]]
quantity = "Energy zero"
text = 'The isolated BCS vacuum energies are subtracted: at $\Gamma=0$ the energies are the atomic energies of $H_d$, with the reservoirs in their quasiparticle vacuum'

[[convention]]
quantity = "Current"
text = '$I=(2e/\hbar)\,\partial E/\partial\phi=(2e/\hbar)\langle\partial H/\partial\phi\rangle$, the electric current from the left to the right lead (electron charge $-e$, $e>0$); reported as $\langle\partial H/\partial\phi\rangle$ in units of $\Delta$'

[[convention]]
quantity = "Voltage"
text = '$V=V_L-V_R$, the electric potential of the left lead relative to the right one, so $eV=\mu_R-\mu_L$; Josephson relation $\dot\phi=2eV/\hbar$; $IV$ is the power supplied by the source'

[[convention]]
quantity = "Sectors"
text = 'Fermion parity (0 even, 1 odd), $2S_z$, optional eta parity and particle number'

[[convention]]
quantity = "Drives"
text = '$p(t)=p_0+\sum_n A_n\cos(n\Omega t+\theta_n)$; $A$ for a monochromatic drive, $A_\phi$ (radians) for the phase and $A_\epsilon$ (energy) for the detuning'

[[convention]]
quantity = "Harmonics"
text = '$H(t)=\sum_k H_k\mathrm{e}^{\mathrm{i}k\Omega t}$, $H_{-k}=H_k^\dagger$, time origin $t=0$'

[[convention]]
quantity = "Floquet states"
text = '$\psi(t)=\mathrm{e}^{-\mathrm{i}\varepsilon t}\sum_m\mathrm{e}^{\mathrm{i}m\Omega t}u_m$ with quasienergy $\varepsilon$; Sambe matrix $H_{m-m^\prime}+m\Omega\delta_{mm^\prime}$, truncated at the Floquet cutoff $\lvert m\rvert\le M$'
