name: release artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      extended: true

  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check source publication privacy
        id: publication-source
        run: python -B tools/check_publication.py
      - run: python tools/check_release.py
      - name: Match the release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/check_release.py --tag "$RELEASE_TAG"
      - run: python -m pip install build twine
      - run: python -m build --sdist
      - run: python tools/check_distribution.py dist/*.tar.gz
      - run: python -B tools/check_publication.py dist/*.tar.gz
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  wheels:
    needs: sdist
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check source publication privacy
        id: publication-source
        run: python -B tools/check_publication.py
      - uses: actions/download-artifact@v4
        with:
          name: release-sdist
          path: dist
      - name: Check downloaded release source
        shell: bash
        run: |
          python tools/check_distribution.py dist/*.tar.gz
          python -B tools/check_publication.py dist/*.tar.gz
      - name: Unpack the release source
        shell: bash
        run: |
          mkdir release-source
          tar -xzf dist/*.tar.gz --strip-components=1 -C release-source
      - uses: pypa/cibuildwheel@v3.4.0
        with:
          package-dir: release-source
          output-dir: wheelhouse
      - name: Inspect repaired wheels
        shell: bash
        run: |
          python -m pip install twine
          python tools/check_distribution.py wheelhouse/*.whl
          python -B tools/check_publication.py wheelhouse/*.whl
          python -m twine check --strict wheelhouse/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: release-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 30

  documentation:
    needs: sdist
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check source publication privacy
        id: publication-source
        run: python -B tools/check_publication.py
      - uses: actions/download-artifact@v4
        with:
          name: release-sdist
          path: dist
      - name: Check downloaded release source
        run: |
          python tools/check_distribution.py dist/*.tar.gz
          python -B tools/check_publication.py dist/*.tar.gz
      - name: Unpack the exact release source
        run: |
          mkdir release-source
          tar -xzf dist/*.tar.gz --strip-components=1 -C release-source
      - name: PDF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-extra \
            texlive-bibtex-extra texlive-science texlive-fonts-recommended fonts-dejavu-core \
            lmodern cm-super biber latexmk librsvg2-bin
      - name: Install from the source archive
        working-directory: release-source
        run: python -m pip install '.[dmrg,dev,docs,docs-pdf,plots]' -c tools/docs-constraints.txt
      - name: Check canonical documentation and independent examples
        working-directory: release-source
        run: |
          python -B tools/check_docs.py
          python -B tools/run_doc_examples.py --require-all
          python -B -m pytest -m docs tests/test_handbook.py tests/test_manual.py
      - name: Build both versioned manuals
        working-directory: release-source
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          archive=$(realpath ../dist/*.tar.gz)
          if [ "$IS_TAG" = "true" ]; then
            python -B tools/build_manuals.py --manual all --release-tag "$RELEASE_REF" \
              --source-ref "$SOURCE_COMMIT" --source-archive "$archive" --output-dir ../manual-assets
          else
            python -B tools/build_manuals.py --manual all --source-ref "$SOURCE_COMMIT" \
              --source-archive "$archive" --output-dir ../manual-assets
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-docs
          path: manual-assets/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.publication-source.outcome == 'success' }}
        with:
          name: documentation-release-diagnostics
          path: |
            release-source/build/manual-logs/
            release-source/build/user-manual/*.log
            release-source/docs/manual/build/*.log
            release-source/docs/manual/build/*.blg
          retention-days: 14

  github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [tests, sdist, wheels, documentation]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish the tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          test -s "release-assets/qdjj-solver-$version-physics-manual.pdf"
          test -s "release-assets/qdjj-solver-$version-users-guide-reference.pdf"
          test -s "release-assets/qdjj-solver-$version-manuals.json"
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            release-assets/*.tar.gz release-assets/*.whl release-assets/*.pdf release-assets/*-manuals.json
